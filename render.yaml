services:
  - type: web
    name: aternos-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false
      - key: ATERNOS_USER
        sync: false
      - key: ATERNOS_PASSWORD
        sync: false
      - key: ATERNOS_SESSION
        sync: false
      - key: ATERNOS_SERVER_ADDRESS
        sync: false

  - type: cron
    name: aternos-bot-ping
    env: python
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python ping.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SERVICE_URL
        sync: false
